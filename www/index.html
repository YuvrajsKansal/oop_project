<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Smart Lost &amp; Found</title>
<style>
:root{--bg:#eaf1f2;--card:#fff;--text:#16303a;--muted:#5d7580;--border:#cfdde0;--accent:#0f766e;--accent-text:#fff;--lost:#b42318;--lost-bg:#fde8e6;--found:#1a7a3c;--found-bg:#ddf3e4;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1b20;--card:#16272e;--text:#e3eef0;--muted:#8fa9b2;--border:#27414a;--accent:#4fd1c5;--accent-text:#0c1a1d;--lost:#ff9b8f;--lost-bg:#3b1f1c;--found:#7fe0a0;--found-bg:#173a25;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1b20;--card:#16272e;--text:#e3eef0;--muted:#8fa9b2;--border:#27414a;--accent:#4fd1c5;--accent-text:#0c1a1d;--lost:#ff9b8f;--lost-bg:#3b1f1c;--found:#7fe0a0;--found-bg:#173a25;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;margin:0}
h1{font-size:1.3rem}
h2{font-size:1.15rem;margin-bottom:6px}
h3{font-size:1.1rem;margin:12px 0 4px}
[hidden]{display:none!important}
.wrap{max-width:880px;margin:0 auto;padding:0 16px}
header{background:var(--card);border-bottom:1px solid var(--border)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-top:12px;padding-bottom:12px}
#who{display:flex;align-items:center;gap:10px}
main{padding-top:20px;padding-bottom:32px}
.lead,.empty{color:var(--muted)}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-top:16px}
label{display:block;font-size:.9rem;font-weight:600;margin:12px 0 4px}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font:inherit}
textarea{min-height:72px;resize:vertical}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font:inherit;cursor:pointer;border:1px solid var(--accent);border-radius:8px;padding:9px 16px;background:var(--accent);color:var(--accent-text);margin-top:16px}
.ghost,.tabs button,.filters button{background:transparent;color:var(--text);border-color:var(--border);margin:0}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tabs button.active,.filters button.active{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.tools input{flex:1 1 220px;width:auto}
.filters{display:flex;gap:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.item{position:relative}
.item::before{content:"";position:absolute;top:23px;left:16px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:1px solid var(--border)}
.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-left:22px;padding-bottom:10px;border-bottom:1px dashed var(--border)}
.id{margin-left:auto;color:var(--muted);font-size:.85rem}
.badge{font-size:.8rem;font-weight:700;padding:2px 10px;border-radius:99px}
.badge.lost{background:var(--lost-bg);color:var(--lost)}
.badge.found{background:var(--found-bg);color:var(--found)}
.badge.done{background:var(--border);color:var(--muted)}
dl{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:10px 0 0;font-size:.9rem}
dt{color:var(--muted)}
dd{margin:0;overflow-wrap:anywhere}
.small{font-size:.85rem;padding:6px 12px;margin-top:14px}
.msg{min-height:1.5em;margin:12px 0 0}
.msg.ok{color:var(--found)}
.msg.err{color:var(--lost)}
footer{text-align:center;color:var(--muted);font-size:.85rem;padding-bottom:24px}
</style>
</head>
<body>
<header>
  <div class="wrap bar">
    <h1>Smart Lost &amp; Found</h1>
    <div id="who" hidden><span id="uname"></span><button id="logout" class="ghost">Log out</button></div>
  </div>
</header>

<main class="wrap">
  <section id="auth">
    <p class="lead">Sign up or log in to report and search lost and found items on campus.</p>
    <div class="two">
      <form id="signup" class="card">
        <h2>Create an account</h2>
        <label for="su-u">Username</label>
        <input id="su-u" name="username" required autocomplete="username">
        <label for="su-p">Password</label>
        <input id="su-p" name="password" type="password" required autocomplete="new-password">
        <label for="su-c">Contact number</label>
        <input id="su-c" name="contact" required>
        <button type="submit">Sign up</button>
      </form>
      <form id="login" class="card">
        <h2>Log in</h2>
        <label for="li-u">Username</label>
        <input id="li-u" name="username" required autocomplete="username">
        <label for="li-p">Password</label>
        <input id="li-p" name="password" type="password" required autocomplete="current-password">
        <button type="submit">Log in</button>
      </form>
    </div>
    <p id="authmsg" class="msg" role="status"></p>
  </section>

  <section id="app" hidden>
    <nav class="tabs" id="nav">
      <button data-view="browse">Browse and search</button>
      <button data-view="report" data-type="lost">Report lost item</button>
      <button data-view="report" data-type="found">Report found item</button>
    </nav>

    <div id="browse">
      <div class="tools">
        <input id="q" type="search" placeholder="Search by name, description, category or place" aria-label="Search items">
        <div class="filters">
          <button data-filter="all">All</button>
          <button data-filter="lost">Lost</button>
          <button data-filter="found">Found</button>
        </div>
      </div>
      <p id="listmsg" class="msg" role="status"></p>
      <div id="list" class="grid"></div>
    </div>

    <div id="reportBox" hidden>
      <form id="report" class="card">
        <h2 id="rtitle"></h2>
        <label for="r-n">Item name</label>
        <input id="r-n" name="itemName" required>
        <label for="r-d">Description (color, brand, size)</label>
        <textarea id="r-d" name="description" required></textarea>
        <label for="cat">Category</label>
        <select id="cat" name="category"></select>
        <label for="r-p" id="lplace"></label>
        <input id="r-p" name="place" required>
        <label for="rdate" id="ldate"></label>
        <input id="rdate" name="date" type="date" required>
        <label for="r-e" id="lextra"></label>
        <input id="r-e" name="extra" required>
        <button type="submit">Submit report</button>
        <p id="rmsg" class="msg" role="status"></p>
      </form>
    </div>
  </section>
</main>
<footer>Connected to the Lost &amp; Found server.</footer>

<script>
var CATS = ["Wallet", "Phone", "ID Card", "Bag", "Keys", "Other"];
var view = "browse", rtype = "lost", filter = "all", me = null, token = null;
var $ = function (id) { return document.getElementById(id); };

try { token = localStorage.getItem("lf_token"); } catch (e) {}

function setToken(t) {
  token = t;
  try {
    if (t) { localStorage.setItem("lf_token", t); } else { localStorage.removeItem("lf_token"); }
  } catch (e) {}
}
function esc(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
function say(id, text, ok) {
  var e = $(id);
  e.textContent = text;
  e.className = "msg " + (ok ? "ok" : "err");
}

function api(path, opts) {
  opts = opts || {};
  opts.headers = token ? { "X-Token": token } : {};
  return fetch(path, opts).then(function (r) {
    return r.json().then(function (d) {
      if (!r.ok) { throw new Error(d.error || "Something went wrong."); }
      return d;
    });
  }, function () {
    throw new Error("Cannot reach the server. Is it running?");
  });
}
function post(path, obj) {
  return api(path, { method: "POST", body: new URLSearchParams(obj || {}) });
}

$("cat").innerHTML = CATS.map(function (c) { return "<option>" + c + "</option>"; }).join("");

$("signup").addEventListener("submit", function (e) {
  e.preventDefault();
  var f = e.target;
  post("/api/signup", { username: f.username.value.trim(), password: f.password.value, contact: f.contact.value.trim() })
    .then(function () { f.reset(); say("authmsg", "Account created. You can log in now.", true); })
    .catch(function (err) { say("authmsg", err.message, false); });
});

$("login").addEventListener("submit", function (e) {
  e.preventDefault();
  var f = e.target;
  post("/api/login", { username: f.username.value.trim(), password: f.password.value })
    .then(function (d) {
      setToken(d.token);
      me = { id: d.id, username: d.username };
      f.reset();
      $("authmsg").textContent = "";
      view = "browse";
      render();
    })
    .catch(function (err) { say("authmsg", err.message, false); });
});

$("logout").addEventListener("click", function () {
  post("/api/logout").catch(function () {}).then(function () {
    setToken(null);
    me = null;
    render();
  });
});

$("nav").addEventListener("click", function (e) {
  var b = e.target.closest("button");
  if (!b) return;
  view = b.dataset.view;
  if (b.dataset.type) rtype = b.dataset.type;
  render();
});

document.querySelector(".filters").addEventListener("click", function (e) {
  var b = e.target.closest("button");
  if (!b) return;
  filter = b.dataset.filter;
  renderList();
});

$("q").addEventListener("input", renderList);

$("report").addEventListener("submit", function (e) {
  e.preventDefault();
  var f = e.target;
  post("/api/items", {
    type: rtype, itemName: f.itemName.value.trim(), description: f.description.value.trim(),
    category: f.category.value, place: f.place.value.trim(), date: f.date.value, extra: f.extra.value.trim()
  }).then(function () {
    f.reset();
    $("rmsg").textContent = "";
    view = "browse";
    render();
  }).catch(function (err) { say("rmsg", err.message, false); });
});

$("list").addEventListener("click", function (e) {
  var id = e.target.dataset.resolve;
  if (!id) return;
  post("/api/items/" + id + "/resolve")
    .then(renderList)
    .catch(function (err) { say("listmsg", err.message, false); });
});

function card(i) {
  var lost = i.type === "lost";
  var own = me && me.id === i.reporter && !i.resolved;
  return '<article class="card item"><div class="top">' +
    '<span class="badge ' + i.type + '">' + (lost ? "Lost" : "Found") + '</span>' +
    (i.resolved ? '<span class="badge done">Resolved</span>' : "") +
    '<span class="id">ID ' + i.id + '</span></div>' +
    '<h3>' + esc(i.name) + '</h3><p>' + esc(i.description) + '</p><dl>' +
    '<dt>Category</dt><dd>' + esc(i.category) + '</dd>' +
    '<dt>' + (lost ? "Lost at" : "Found at") + '</dt><dd>' + esc(i.place) + '</dd>' +
    '<dt>Date</dt><dd>' + esc(i.date) + '</dd>' +
    '<dt>' + (lost ? "Identifying mark" : "Kept at") + '</dt><dd>' + esc(i.extra) + '</dd>' +
    '<dt>Contact</dt><dd>' + esc(i.contact) + " (" + esc(i.reporterName) + ")" + '</dd></dl>' +
    (own ? '<button class="small" data-resolve="' + i.id + '">Mark as resolved</button>' : "") +
    '</article>';
}

function renderList() {
  document.querySelectorAll("[data-filter]").forEach(function (b) {
    b.classList.toggle("active", b.dataset.filter === filter);
  });
  var q = $("q").value.trim();
  api("/api/items?type=" + filter + "&q=" + encodeURIComponent(q)).then(function (items) {
    $("listmsg").textContent = "";
    $("list").innerHTML = items.length ? items.map(card).join("") : '<p class="empty">No items found. Report one from the tabs above.</p>';
  }).catch(function (err) { say("listmsg", err.message, false); });
}

function render() {
  $("auth").hidden = !!me;
  $("app").hidden = !me;
  $("who").hidden = !me;
  if (!me) return;
  $("uname").textContent = me.username;
  $("browse").hidden = view !== "browse";
  $("reportBox").hidden = view !== "report";
  document.querySelectorAll("#nav button").forEach(function (b) {
    var on = b.dataset.view === view && (view === "browse" || b.dataset.type === rtype);
    b.classList.toggle("active", on);
  });
  if (view === "report") {
    var lost = rtype === "lost";
    $("rtitle").textContent = lost ? "Report a lost item" : "Report a found item";
    $("lplace").textContent = lost ? "Where did you lose it?" : "Where did you find it?";
    $("ldate").textContent = lost ? "Date lost" : "Date found";
    $("lextra").textContent = lost ? "Identifying mark (sticker, scratch, etc.)" : "Where is the item kept now?";
    if (!$("rdate").value) $("rdate").value = new Date().toISOString().slice(0, 10);
  } else {
    renderList();
  }
}

if (token) {
  api("/api/me").then(function (d) { me = d; render(); }).catch(function () { setToken(null); render(); });
} else {
  render();
}
</script>
</body>
</html>
